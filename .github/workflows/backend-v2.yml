name: backend-v2

# Quarkus migration track. Paths-filtered so Java changes get their own gate
# without burning minutes on Python/web/iOS pushes. Dev Services uses the
# runner's Docker daemon for the Postgres testcontainer.
on:
  push:
    paths:
      - "backend-v2/**"
      - ".github/workflows/backend-v2.yml"
  pull_request:
    paths:
      - "backend-v2/**"
      - ".github/workflows/backend-v2.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: JVM tests (Dev Services Postgres)
        run: ./mvnw -B test

  native:
    # The last Phase 0-1 spike item: GraalVM native image builds in CI
    # (container build via Mandrel; ~have 16GB on ubuntu-latest runners).
    # Deliberately after `test` — no point burning native minutes on red code.
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend-v2
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: iron
          POSTGRES_DB: iron
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Native image build (tests already ran in the test job)
        # Pin the Mandrel builder image by DIGEST (bean 42u0) — the SAME image the
        # Railway Dockerfile uses (jdk-25.0.4, Quarkus 3.37.3's default). Keeps
        # "CI green ⇒ Railway-buildable" true. Bump both together on a Quarkus upgrade.
        run: >-
          ./mvnw -B package -Dnative -Dquarkus.native.container-build=true -DskipTests
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image@sha256:93bcce120e35460b44c57efe2586e1d913cbfe32ddb418f0a7375a86850b54f1
      - name: Smoke-run the binary against Postgres
        env:
          DATABASE_JDBC_URL: jdbc:postgresql://localhost:5432/iron
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: iron
        run: |
          ls -lh target/*-runner
          code=0
          timeout 15 ./target/*-runner || code=$?
          # 124 = timeout killed a healthy running server; anything else
          # (including a clean instant exit) is a startup failure.
          test "$code" -eq 124

  # The FastAPI↔backend-v2 strangler parity gate was retired 2026-07-21, and the
  # whole FastAPI app + parity harness were deleted with the full decommission
  # (bean foi1). backend-v2 (Quarkus) is the source of truth; the `test` job above
  # is the JVM gate and the web/iOS have their own.
